name: Deploy to Beefy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to beefy
        uses: appleboy/ssh-action@v1
        with:
          host: 5.78.152.85
          username: buduser
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/buduser/apps/daily-spiritual-note
            git pull origin main
            mkdir -p logs
            echo "Deployed at $(date -Is)" >> logs/deploy.log
